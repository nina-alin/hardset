# Configuration du générateur de sets. Ajouter un profil ne demande aucune
# modification de code.

# Chemin de l'export XML proposé par défaut dans le formulaire.
collection_xml: ~/rekordbox.xml

# Durée moyenne jouée par morceau (en secondes), utilisée pour convertir la
# durée demandée du set en nombre de morceaux.
seconds_per_track: 120

# L'ordre définit l'échelle ordinale 1 → 5. Ce sont les My Tags de mood tels
# qu'ils sont écrits dans Rekordbox ; la comparaison ignore la casse et les
# accents, mais l'orthographe doit rester la leur (« VNR », pas « vénère »).
moods:
  - CALME
  - DANSANT
  - UN PEU VNR
  - CARREMENT VNR
  - C DU BRUIT

# My Tags qui ne sont ni un genre ni un mood : état de préparation du morceau
# et jouabilité. Le XML ne dit pas à quelle catégorie appartient un tag, et la
# règle du lecteur est « tout ce qui n'est ni mood, ni ignoré, ni une plage de
# BPM est un genre » — sans cette liste, `BEAT GRID CHECKED` deviendrait un
# genre. Les plages de BPM (`140-150`, `195+`) sont reconnues à leur forme et
# n'ont pas à figurer ici.
tags_ignores:
  - BEAT GRID CHECKED
  - BEAT GRID TO CORRECT
  - CUE POINTS CHECKED
  - CUE POINTS TO CORRECT
  - FACILE
  - PAS FACILE
  - OK TIER
  - TROP DUR A MIXER
  - OPENER

poids:
  bpm: 1.0
  mood: 1.5
  tonalite: 0.4
  bpm_tolerance: 5.0   # un écart de 5 BPM coûte 1 unité avant pondération
  k: 5                 # largeur du tirage aléatoire

profils:
  montee:
    label: "Montée"
    bpm:  {type: lineaire}
    mood: {type: lineaire}
  warmup-long:
    label: "Warm-up long"
    bpm:  {type: retarde, palier: 0.4}
    mood: {type: retarde, palier: 0.4}
  plateau:
    label: "Plateau"
    bpm:  {type: lineaire, depart: 0.7}
    mood: {type: lineaire, depart: 0.7}
  vagues:
    label: "Vagues"
    bpm:  {type: vagues, amplitude: 0.15, oscillations: 2.5}
    mood: {type: lineaire}
